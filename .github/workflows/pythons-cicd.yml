
name: Python CI-CD AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Python Application
        run: |
          python3 -m py_compile app.py

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Test EC2 Connection
        run: |
          ssh -i ~/.ssh/ec2_key \
          -o StrictHostKeyChecking=yes \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "echo EC2 SSH Connection Successful"

      - name: Install Python on EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "sudo apt-get update && sudo apt-get install -y python3"

      - name: Create Deployment Directory
        run: |
          ssh -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "mkdir -p ~/python-app"

      - name: Copy Application to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
          app.py \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/python-app/app.py

      - name: Execute Application on EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "cd ~/python-app && python3 app.py"

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/ec2_key \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
          "ls -l ~/python-app && python3 --version"

      - name: Deployment Completed
        run: echo "Application successfully deployed to AWS EC2"
